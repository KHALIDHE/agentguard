# AgentGuard policy for the demo finance company.
#
# Rules are checked by ascending priority; the first rule that matches decides.
# Anything not matched by a rule is DENIED (rule id "default-deny").
#
# decision:  ALLOW | DENY | MASK | REQUIRE_APPROVAL
# scope:     NONE | SAME_DEPARTMENT | OWN_SUPPLIERS   (which rows may come back)
# when:      { argument: x, in: [..] } | { argument: x, gt: n } | { argument: x, present: true }
#            | { all: [..] } | { any: [..] } | { not: {..} }

rules:

  # --- Salaries ------------------------------------------------------------
  - id: salaries-hr
    priority: 10
    roles: [HR]
    tools: [get_employee_salaries]
    decision: ALLOW
    reason: "HR manages salaries."

  - id: salaries-everyone-else
    priority: 11
    roles: [FINANCE_MANAGER, ACCOUNTANT, CLERK, ADMIN]
    tools: [get_employee_salaries]
    decision: DENY
    reason: "Salary data is restricted to HR."

  # --- Free SQL --------------------------------------------------------------
  - id: sql-admin
    priority: 20
    roles: [ADMIN]
    tools: [run_query]
    decision: ALLOW
    reason: "Administrators may run read-only queries; the SQL guard checks every statement."

  # --- Exports and bulk writes: a human approves first -------------------------
  - id: export-suppliers-admin
    priority: 30
    roles: [ADMIN]
    tools: [export_report]
    decision: REQUIRE_APPROVAL
    reason: "Bulk exports leave the company's systems and need a second person's approval."

  - id: export-invoices-manager
    priority: 31
    roles: [FINANCE_MANAGER]
    tools: [export_report]
    when: { argument: reportType, in: [INVOICES] }
    scope: SAME_DEPARTMENT
    decision: REQUIRE_APPROVAL
    reason: "Managers may export their department's invoices after approval."

  - id: cancel-day-clerk
    priority: 40
    roles: [CLERK, ADMIN]
    tools: [cancel_invoices]
    scope: SAME_DEPARTMENT
    decision: REQUIRE_APPROVAL
    reason: "Cancelling a whole day of invoices affects many suppliers and needs approval."

  # --- Suppliers ----------------------------------------------------------------
  - id: suppliers-manager
    priority: 50
    roles: [FINANCE_MANAGER]
    tools: [search_suppliers, get_supplier_record]
    scope: SAME_DEPARTMENT
    decision: ALLOW
    reason: "Managers see full records of suppliers in their department."

  - id: suppliers-accountant
    priority: 51
    roles: [ACCOUNTANT]
    tools: [search_suppliers, get_supplier_record]
    scope: SAME_DEPARTMENT
    decision: MASK
    maskProfile: accountant-supplier
    reason: "Accountants see suppliers of their department, without address, and with tax ID and IBAN masked."

  - id: suppliers-search-clerk
    priority: 52
    roles: [CLERK]
    tools: [search_suppliers]
    scope: SAME_DEPARTMENT
    decision: MASK
    maskProfile: clerk-supplier
    reason: "Clerks can find a supplier by name to record an invoice, nothing more."

  - id: suppliers-record-clerk
    priority: 53
    roles: [CLERK]
    tools: [get_supplier_record]
    decision: DENY
    reason: "Supplier bank details are for finance employees."

  # --- Invoices --------------------------------------------------------------
  - id: pay-large-needs-approval
    priority: 59
    roles: [FINANCE_MANAGER, CLERK]
    tools: [update_invoice]
    when: { argument: amountMad, gt: 10000 }
    scope: SAME_DEPARTMENT
    decision: REQUIRE_APPROVAL
    reason: "Payments above 10,000 MAD need a second person's approval."

  - id: invoices-read-finance
    priority: 60
    roles: [FINANCE_MANAGER, ACCOUNTANT, CLERK]
    tools: [list_invoices]
    scope: SAME_DEPARTMENT
    decision: ALLOW
    reason: "Department staff see their department's invoices."

  - id: invoices-update
    priority: 61
    roles: [FINANCE_MANAGER, CLERK]
    tools: [update_invoice]
    scope: SAME_DEPARTMENT
    decision: ALLOW
    reason: "Managers and clerks may change one invoice in their department."

  # --- Shared, non-sensitive ---------------------------------------------------------
  - id: directory-everyone
    priority: 90
    roles: [FINANCE_MANAGER, ACCOUNTANT, CLERK, HR, ADMIN]
    tools: [get_employee_directory]
    decision: ALLOW
    reason: "The employee directory is internal but not sensitive."

  - id: documents-everyone
    priority: 91
    roles: [FINANCE_MANAGER, ACCOUNTANT, CLERK, HR, ADMIN]
    tools: [get_document]
    decision: ALLOW
    reason: "Internal documents are readable by employees; their content is treated as untrusted."
