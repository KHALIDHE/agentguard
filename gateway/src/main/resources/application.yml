spring:
  application:
    name: agentguard-gateway

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${AGENTGUARD_DB_USER:agentguard}
    password: ${AGENTGUARD_DB_PASSWORD:agentguard}

  flyway:
    locations: classpath:db/gateway

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        name: agentguard
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
      client:
        # The gateway builds its own upstream client (UpstreamClient) so it
        # controls the service token and reconnects; Spring AI's is not used.
        enabled: false

agentguard:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 1h
    issuer: agentguard
  demo:
    user-password: ${DEMO_USER_PASSWORD:}
  upstream:
    hospital-tools-url: ${HOSPITAL_TOOLS_URL:http://localhost:8081}
    service-token: ${HOSPITAL_SERVICE_TOKEN:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
