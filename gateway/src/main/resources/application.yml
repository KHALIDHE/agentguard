spring:
  application:
    name: agentguard-gateway

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${AGENTGUARD_DB_USER:agentguard}
    password: ${AGENTGUARD_DB_PASSWORD:agentguard}

  flyway:
    locations: classpath:db/gateway

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        name: agentguard
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
      client:
        # The gateway builds its own upstream client (UpstreamClient) so it
        # controls the service token and reconnects; Spring AI's is not used.
        enabled: false

agentguard:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 1h
    issuer: agentguard
  demo:
    user-password: ${DEMO_USER_PASSWORD:}
  approvals:
    timeout: PT10M
  limits:
    calls-per-minute: 30        # per user and tool
    per-tool:
      run_query: 10
      export_report: 5
    exports-per-day: 3          # export requests per user per day
  content:
    quarantine: false           # true: withhold flagged documents instead of labelling them
  upstream:
    finance-tools-url: ${FINANCE_TOOLS_URL:http://localhost:8081}
    service-token: ${FINANCE_SERVICE_TOKEN:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
