spring:
  application:
    name: finance-tools

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${FINANCE_DB_USER:finance}
    password: ${FINANCE_DB_PASSWORD:finance}

  flyway:
    locations: classpath:db/finance

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        name: finance-tools
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

finance:
  # Shared secret the gateway sends on every call. Empty means every call is refused.
  service-token: ${FINANCE_SERVICE_TOKEN:}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
