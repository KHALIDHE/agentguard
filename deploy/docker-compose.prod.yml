# AgentGuard next to QlinkR Order on the same server. It joins the network of the QlinkR stack
# (project "deploy", network deploy_default) and uses the same Oracle container: its own two
# database users, FINANCE and AGENTGUARD, are created once with deploy/init-db.sh.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  finance-tools:
    build: { context: .., dockerfile: finance-tools/Dockerfile }
    restart: unless-stopped
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?}
      FINANCE_SERVICE_TOKEN: ${FINANCE_SERVICE_TOKEN:?}
      JAVA_TOOL_OPTIONS: -Xmx300m
    networks: [shared]

  gateway:
    build: { context: .., dockerfile: gateway/Dockerfile }
    restart: unless-stopped
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      AGENTGUARD_DB_PASSWORD: ${AGENTGUARD_DB_PASSWORD:?}
      FINANCE_TOOLS_URL: http://finance-tools:8081
      FINANCE_SERVICE_TOKEN: ${FINANCE_SERVICE_TOKEN:?}
      JWT_SECRET: ${JWT_SECRET:?}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?}
      JAVA_TOOL_OPTIONS: -Xmx400m
    depends_on: [finance-tools]
    networks: [shared]

  demo-agent:
    build: { context: .., dockerfile: demo-agent/Dockerfile }
    restart: unless-stopped
    environment:
      AI_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Extra Spring settings as JSON. Groq needs {"spring":{"ai":{"openai":{"chat":{"options":{"extra-body":{"include_reasoning":false}}}}}}}
      SPRING_APPLICATION_JSON: ${AGENT_OPTIONS_JSON:-{}}
      GATEWAY_URL: http://gateway:8080
      MAX_CHATS_PER_HOUR: ${MAX_CHATS_PER_HOUR:-40}
      JAVA_TOOL_OPTIONS: -Xmx300m
    depends_on: [gateway]
    networks: [shared]

  # The dashboard, and the routes to the gateway and the agent. The main Caddy of the QlinkR stack
  # sends agentguard.<domain> here and handles HTTPS.
  agentguard-web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    depends_on: [gateway, demo-agent]
    networks: [shared]

networks:
  shared:
    name: deploy_default
    external: true
