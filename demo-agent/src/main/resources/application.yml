spring:
  application:
    name: agentguard-demo-agent

  ai:
    # One switch picks the provider: AI_PROVIDER=ollama (default, local) or AI_PROVIDER=openai.
    model:
      chat: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    mcp:
      client:
        enabled: false   # phase 8 connects the agent to the gateway
        streamable-http:
          connections:
            agentguard:
              url: ${GATEWAY_URL:http://localhost:8080}
              endpoint: /mcp

server:
  port: 8082
