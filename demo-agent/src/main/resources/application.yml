spring:
  application:
    name: agentguard-demo-agent

  ai:
    # One switch picks the provider: AI_PROVIDER=ollama (default, local) or AI_PROVIDER=openai.
    model:
      chat: ${AI_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Any OpenAI-compatible service works, for example Groq: https://api.groq.com/openai/v1
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    mcp:
      client:
        enabled: false   # the agent opens its own connection per request, with the user's token
        streamable-http:
          connections:
            agentguard:
              url: ${GATEWAY_URL:http://localhost:8080}
              endpoint: /mcp

agent:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  max-chats-per-hour: ${MAX_CHATS_PER_HOUR:40}

server:
  port: 8082
